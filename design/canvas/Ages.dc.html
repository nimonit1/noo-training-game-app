<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>年代別ホーム画面の比較</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1500px; height: 920px; box-sizing: border-box; padding: 40px; background: #FFFFFF; color: #222222; font-family: 'Segoe UI', 'Yu Gothic', '游ゴシック', sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 32px; line-height: 1.25">年代別ホーム画面の比較</h1>
      <span style="font-size: 14px; color: #666666">同じ部品を使い、出題の組み合わせ・見せ方・文字サイズだけを年代ごとに変えています。</span>
    </div>
    <span style="font-size: 14px; color: #666666">テーマ: 一般テーマ</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px">
    <sc-for list="{{ages}}" as="a" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 12px; min-width: 0">
        <div style="display: flex; align-items: baseline; gap: 4px">
          <span style="font-size: 32px; font-weight: 700; color: #0F766E; line-height: 1.2">{{a.num}}</span>
          <span style="font-size: 16px; font-weight: 700; color: #0F766E">代</span>
        </div>
        <div style="height: 600px; box-sizing: border-box; overflow: hidden; border: 2px solid #E3F3F1; border-radius: 32px; display: flex; flex-direction: column; background: #FFFFFF">
          <div style="height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between">
            <div style="display: flex; align-items: center; gap: 6px">
              <div style="width: 24px; height: 24px; border-radius: 12px; background: #0F766E"></div>
              <span style="font-size: 14px; font-weight: 700">脳トレ道場(仮)</span>
            </div>
            <div style="height: 36px; padding: 0 12px; border-radius: 18px; border: 2px solid #0F766E; background: #E3F3F1; color: #0F766E; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px">
              <span>{{a.label}}</span>
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
          <div style="flex: 1; min-height: 0; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 12px">
            <div style="position: relative; border-radius: 24px; background: #E3F3F1; padding: 16px; display: flex; flex-direction: column; gap: 6px">
              <div style="position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 18px; background: #E0603A"></div>
              <span style="font-size: 14px; color: #666666">今日のトレーニング</span>
              <span style="font-size: 24px; font-weight: 700; line-height: 1.3">{{a.minutes}}分で完了</span>
              <div style="display: flex; flex-wrap: wrap; gap: 6px">
                <sc-for list="{{a.tags}}" as="tg" hint-placeholder-count="2">
                  <span style="font-size: 14px; font-weight: 700; color: #0F766E; background: #FFFFFF; border: 2px solid #0F766E; border-radius: 14px; padding: 0 10px; line-height: 24px">{{tg.t}}</span>
                </sc-for>
              </div>
              <div style="margin-top: 4px; height: 48px; border-radius: 24px; background: #0F766E; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">スタート</div>
            </div>
            <div style="border-radius: 16px; background: #FDEAE4; padding: 12px 16px; display: flex; flex-direction: column">
              <span style="font-size: 14px; font-weight: 700">{{a.extraTitle}}</span>
              <span style="font-size: 14px; color: #666666">{{a.extraBody}}</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <sc-for list="{{a.games}}" as="g" hint-placeholder-count="3">
                <div style="min-height: 56px; box-sizing: border-box; border: 2px solid #E3F3F1; border-radius: 16px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
                  <div style="display: flex; flex-direction: column; min-width: 0">
                    <span style="font-size: {{a.body}}px; font-weight: 700; line-height: 1.3">{{g.name}}</span>
                    <span style="font-size: 14px; color: #666666">{{g.fn}}</span>
                  </div>
                  <span style="font-size: 14px; color: #666666; flex-shrink: 0">{{g.min}}分</span>
                </div>
              </sc-for>
            </div>
          </div>
          <div style="height: 56px; border-top: 2px solid #E3F3F1; display: flex">
            <div style="flex: 1; display: flex; align-items: center; justify-content: center; color: #0F766E; font-size: 14px; font-weight: 700">ホーム</div>
            <div style="flex: 1; display: flex; align-items: center; justify-content: center; color: #666666; font-size: 14px">記録</div>
            <div style="flex: 1; display: flex; align-items: center; justify-content: center; color: #666666; font-size: 14px">設定</div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 700">{{a.focus}}</span>
          <span style="font-size: 14px; color: #666666">{{a.note}}</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1500,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (a) => ({ ...a, tags: a.tags.map((t) => ({ t: t })) });
    return {
      ages: [
        mk({ num: '10', label: '10代', focus: '実行機能・注意', minutes: 5, body: 16,
          tags: ['実行機能', '注意'],
          games: [{ name: 'ルール切替ダッシュ', fn: '実行機能', min: 2 }, { name: 'ストップ&ゴー', fn: '抑制', min: 1 }, { name: 'ひらめきタップ', fn: '注意', min: 2 }],
          extraTitle: '今週のランキング', extraBody: '12位 ・ 連続3日',
          note: 'テンポの速い切替課題。ランキングと連続日数で続けやすく。' }),
        mk({ num: '20', label: '20代', focus: 'ワーキングメモリ・注意', minutes: 5, body: 16,
          tags: ['ワーキングメモリ', '注意'],
          games: [{ name: 'ナンバーバック', fn: 'ワーキングメモリ', min: 2 }, { name: '位置おぼえ', fn: 'ワーキングメモリ', min: 2 }, { name: '反応タップ', fn: '注意', min: 1 }],
          extraTitle: '友だちと比べる', extraBody: '今週は3人が挑戦中',
          note: '覚えて操作する課題。友だちとの比較で動機づけ。' }),
        mk({ num: '30', label: '30代', focus: '実行機能・処理速度', minutes: 7, body: 16,
          tags: ['実行機能', '処理速度'],
          games: [{ name: 'ダブルタスク', fn: '実行機能', min: 3 }, { name: '切替ミックス', fn: '実行機能', min: 2 }, { name: '素早く判断', fn: '処理速度', min: 2 }],
          extraTitle: 'すきま3分モード', extraBody: '通勤や休憩の合間にすぐ始められます',
          note: '同時判断の課題。忙しい日でも続く短時間モードを用意。' }),
        mk({ num: '40', label: '40代', focus: '処理速度・視覚注意', minutes: 8, body: 18,
          tags: ['処理速度', '視覚注意'],
          games: [{ name: '周辺ターゲット判断', fn: '視覚注意', min: 3 }, { name: '素早く判断', fn: '処理速度', min: 3 }, { name: 'ルール切替', fn: '実行機能', min: 2 }],
          extraTitle: '週のふりかえり', extraBody: '今週は4日トレーニングしました',
          note: '周辺視野と素早い判断。文字を大きめにし、週単位で振り返る。' })
      ]
    };
  }
}
</script>
</body>
</html>
